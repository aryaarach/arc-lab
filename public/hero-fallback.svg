  <path d="M206 355 A148 148 0 1 1 434 355" fill="none" stroke="#0B0B0F" stroke-width="3" stroke-linecap="round"/>

  <!-- Inner Wireframe Icosahedron representation -->
  <polygon points="320,178 396,232 368,322 272,322 244,232" fill="#FF6B4A" fill-opacity="0.18" stroke="#0B0B0F" stroke-width="3"/>
  <line x1="320" y1="178" x2="320" y2="262" stroke="#0B0B0F" stroke-width="2.5"/>
