<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img" aria-label="Ilustrasi meja kerja studio desain Arc Lab berisi logo busur 3D, kotak kemasan koral, kaleng sian, cangkir kuning, dan palet warna">
  <!-- Desk Hard Offset Shadow Disc -->
  <ellipse cx="352" cy="396" rx="258" ry="82" fill="#0B0B0F"/>
  <!-- Desk Flat Paper Surface Disc -->
  <ellipse cx="340" cy="384" rx="258" ry="82" fill="#EAE5D9" stroke="#0B0B0F" stroke-width="3.5"/>
  <ellipse cx="340" cy="380" rx="224" ry="66" fill="none" stroke="#0B0B0F" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Hard Dark Blob Shadows on Desk -->
  <ellipse cx="196" cy="378" rx="56" ry="18" fill="#0B0B0F"/>
  <ellipse cx="342" cy="392" rx="68" ry="20" fill="#0B0B0F"/>
  <ellipse cx="486" cy="374" rx="48" ry="16" fill="#0B0B0F"/>
  <ellipse cx="432" cy="422" rx="44" ry="14" fill="#0B0B0F"/>
  <ellipse cx="252" cy="426" rx="62" ry="14" fill="#0B0B0F"/>

  <!-- Floating Decor: Indigo Cube (top-left) -->
  <g transform="translate(132, 118) rotate(-14)">
    <rect x="6" y="6" width="44" height="44" rx="4" fill="#0B0B0F"/>
    <rect x="0" y="0" width="44" height="44" rx="4" fill="#5B5BFF" stroke="#0B0B0F" stroke-width="3.5"/>
    <line x1="10" y1="12" x2="34" y2="12" stroke="#F4F1EA" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Decor: Coral Cone (top-right) -->
  <g transform="translate(498, 96) rotate(12)">
    <polygon points="30,6 58,58 2,58" fill="#0B0B0F"/>
    <polygon points="25,0 53,52 -3,52" fill="#FF6B4A" stroke="#0B0B0F" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- Floating Decor: Cyan Half-Ring (upper center-left) -->
  <g transform="translate(248, 86) rotate(-18)">
    <path d="M4 34 A26 26 0 0 1 56 34" fill="none" stroke="#0B0B0F" stroke-width="15" stroke-linecap="round" transform="translate(4,4)"/>
    <path d="M4 34 A26 26 0 0 1 56 34" fill="none" stroke="#22E6D0" stroke-width="11" stroke-linecap="round"/>
    <path d="M4 34 A26 26 0 0 1 56 34" fill="none" stroke="#0B0B0F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- LEFT OBJECT: Coral Box Package ("KEMASAN") -->
  <g transform="translate(132, 206)">
    <!-- 3D Side Face -->
    <polygon points="96,16 124,2 124,142 96,158" fill="#D94E30" stroke="#0B0B0F" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- 3D Top Face -->
    <polygon points="0,16 28,2 124,2 96,16" fill="#FFD84D" stroke="#0B0B0F" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Front Face -->
    <rect x="0" y="16" width="96" height="142" fill="#FF6B4A" stroke="#0B0B0F" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Label Detail -->
    <rect x="14" y="42" width="68" height="74" fill="#F4F1EA" stroke="#0B0B0F" stroke-width="3"/>
    <rect x="22" y="54" width="52" height="12" fill="#0B0B0F"/>
    <rect x="22" y="74" width="38" height="8" fill="#5B5BFF"/>
    <circle cx="48" cy="99" r="8" fill="#FFD84D" stroke="#0B0B0F" stroke-width="2.5"/>
  </g>

  <!-- RIGHT-BACK OBJECT: Cyan Can ("KALENG") -->
  <g transform="translate(442, 212)">
    <path d="M0 18 L0 134 A44 14 0 0 0 88 134 L88 18 Z" fill="#22E6D0" stroke="#0B0B0F" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="44" cy="18" rx="44" ry="14" fill="#F4F1EA" stroke="#0B0B0F" stroke-width="3.5"/>
    <ellipse cx="44" cy="18" rx="26" ry="7" fill="none" stroke="#0B0B0F" stroke-width="2.5"/>
    <!-- Can Stripe & Badge -->
    <rect x="2" y="52" width="84" height="48" fill="#F4F1EA" stroke="#0B0B0F" stroke-width="3"/>
    <text x="44" y="82" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#0B0B0F">ARC</text>
  </g>

  <!-- CENTER HERO OBJECT: 3D Arc Logo Mark (Indigo Open Ring + Ink Center Sphere) -->
  <g transform="translate(340, 236)">
    <!-- Back Hard Offset Shadow of Ring -->
    <path d="M-58 48 A82 82 0 1 1 58 48" fill="none" stroke="#0B0B0F" stroke-width="34" stroke-linecap="round" transform="translate(6, 7)"/>
    <!-- Indigo Main Ring -->
    <path d="M-58 48 A82 82 0 1 1 58 48" fill="none" stroke="#5B5BFF" stroke-width="26" stroke-linecap="round"/>
    <!-- Highlight Toon Band -->
    <path d="M-64 -26 A76 76 0 0 1 42 -62" fill="none" stroke="#8585FF" stroke-width="7" stroke-linecap="round"/>
    <!-- Center Ink Dot Sphere -->
    <circle cx="4" cy="4" r="23" fill="#0B0B0F"/>
    <circle cx="0" cy="0" r="22" fill="#0B0B0F" stroke="#F4F1EA" stroke-width="2.5"/>
    <circle cx="-6" cy="-6" r="5" fill="#FFD84D"/>
  </g>

  <!-- FRONT-RIGHT OBJECT: Yellow Cup ("CANGKIR") -->
  <g transform="translate(394, 298)">
    <!-- Cup Body -->
    <polygon points="6,20 74,20 64,108 16,108" fill="#FFD84D" stroke="#0B0B0F" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Coffee Sleeve -->
    <polygon points="10,48 70,48 67,80 13,80" fill="#F4F1EA" stroke="#0B0B0F" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="40" cy="64" r="8" fill="#FF6B4A" stroke="#0B0B0F" stroke-width="2.5"/>
    <!-- Barista Lid -->
    <rect x="0" y="8" width="80" height="14" rx="4" fill="#0B0B0F"/>
    <rect x="8" y="0" width="64" height="10" rx="3" fill="#0B0B0F"/>
  </g>

  <!-- FRONT-LEFT: Flat Color Palette Strip (4 Swatch Tiles) -->
  <g transform="translate(184, 396) rotate(-7)">
    <rect x="5" y="5" width="142" height="36" rx="4" fill="#0B0B0F"/>
    <rect x="0" y="0" width="142" height="36" rx="4" fill="#F4F1EA" stroke="#0B0B0F" stroke-width="3"/>
    <rect x="7" y="6" width="28" height="24" fill="#5B5BFF" stroke="#0B0B0F" stroke-width="2"/>
    <rect x="40" y="6" width="28" height="24" fill="#22E6D0" stroke="#0B0B0F" stroke-width="2"/>
    <rect x="73" y="6" width="28" height="24" fill="#FF6B4A" stroke="#0B0B0F" stroke-width="2"/>
    <rect x="106" y="6" width="28" height="24" fill="#FFD84D" stroke="#0B0B0F" stroke-width="2"/>
  </g>
</svg>
