<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-label="Foto studio kemasan produk UMKM di atas latar siklorama netral">
  <defs>
    <linearGradient id="cycBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E8E4"/>
      <stop offset="60%" stop-color="#F2F2F0"/>
      <stop offset="76%" stop-color="#E2E2DE"/>
      <stop offset="100%" stop-color="#F2F2F0"/>
    </linearGradient>
    <radialGradient id="softShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#0A0A0A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pouchBody" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="48%" stop-color="#F2F2F0"/>
      <stop offset="100%" stop-color="#DCDCD8"/>
    </linearGradient>
    <linearGradient id="cupBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F2F2F0"/>
      <stop offset="100%" stop-color="#D9D9D5"/>
    </linearGradient>
    <linearGradient id="bottleGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#222220"/>
      <stop offset="30%" stop-color="#3A3A36"/>
      <stop offset="75%" stop-color="#141413"/>
      <stop offset="100%" stop-color="#222220"/>
    </linearGradient>
  </defs>

  <rect width="760" height="540" fill="url(#cycBg)"/>

  <ellipse cx="195" cy="436" rx="92" ry="20" fill="url(#softShadow)"/>
  <ellipse cx="380" cy="448" rx="124" ry="26" fill="url(#softShadow)"/>
  <ellipse cx="566" cy="436" rx="84" ry="18" fill="url(#softShadow)"/>

  <!-- LEFT: Beverage Cup -->
  <g transform="translate(132, 182)">
    <line x1="68" y1="-34" x2="58" y2="42" stroke="#E63312" stroke-width="9" stroke-linecap="butt"/>
    <polygon points="14,54 114,54 98,248 30,248" fill="url(#cupBody)"/>
    <polygon points="18,98 110,98 103,196 25,196" fill="#0A0A0A"/>
    <text x="64" y="150" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">KOPI SENJA</text>
    <path d="M10,54 C14,14 114,14 118,54 Z" fill="#FFFFFF" fill-opacity="0.86"/>
    <rect x="6" y="48" width="116" height="9" fill="#E4E4E0"/>
  </g>

  <!-- RIGHT: Glass Bottle -->
  <g transform="translate(514, 132)">
    <rect x="36" y="0" width="36" height="32" fill="#0A0A0A"/>
    <path d="M40,32 L40,78 C40,104 12,118 12,150 L12,292 C12,300 20,304 54,304 C88,304 96,300 96,292 L96,150 C96,118 68,104 68,78 L68,32 Z" fill="url(#bottleGlass)"/>
    <rect x="22" y="146" width="7" height="142" fill="#FFFFFF" fill-opacity="0.26"/>
    <rect x="12" y="168" width="84" height="102" fill="#FFFFFF"/>
    <rect x="18" y="176" width="72" height="4" fill="#E63312"/>
    <text x="54" y="224" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#0A0A0A">KOPI SENJA</text>
    <text x="54" y="244" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#8A8A86">01 / 250ML</text>
  </g>

  <!-- CENTER: Standing Pouch -->
  <g transform="translate(274, 108)">
    <path d="M16,0 L196,0 L206,318 C206,332 170,338 106,338 C42,338 6,332 6,318 Z" fill="url(#pouchBody)"/>
    <line x1="18" y1="38" x2="194" y2="38" stroke="#D9D9D5" stroke-width="2"/>
    <rect x="28" y="64" width="156" height="224" fill="#FFFFFF" stroke="#D9D9D5" stroke-width="1"/>
    <rect x="42" y="80" width="128" height="4" fill="#E63312"/>
    <path d="M92 154 A20 20 0 1 1 120 154" fill="none" stroke="#0A0A0A" stroke-width="3.5"/>
    <circle cx="106" cy="140" r="5" fill="#E63312"/>
    <text x="106" y="204" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="600" letter-spacing="-0.5" fill="#0A0A0A">KOPI SENJA</text>
    <text x="106" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#8A8A86">NO. 01 · NETTO 250G</text>
